# 雷达安装方式配置（安装姿态 / 棱镜相位 / 偏心）
#
# 可视化: docs/lidar_offset_3d.html
#         单文件 3D 交互示意图：把这个配置画出来（雷达三轴朝向 + offset 方向 +
#         扫描面 + 0/90/180/270° 波束 + 转盘旋转平面/轴）。双击即可用浏览器打开。
#         ⚠️ 改完本文件后请同步更新该页面里的 CFG 常量（那里是手抄的一份副本，
#            因为浏览器在 file:// 下不能直接读本地 yaml）。
#
# 坐标系约定（下面每个字段都标注作用在哪个系）:
#   [雷达系] LiDAR 自身坐标系：x = 0° 波束方向, y = 90° 波束方向, z = 扫描面法向(镜头轴)
#   [世界系] 转盘/重建坐标系：z = 转盘旋转轴(竖直)，x / y = 旋转平面内的两个水平方向
#
# 本文件是安装几何的唯一来源：代码不再内置默认值，任何字段缺失都会直接报错。
#
name: side-mount                            # [无] 标识名，不参与计算
description: 横装：雷达 x 下、y 左、z 前      # [无] 说明文字，不参与计算

# 棱镜 0° 参考相位：把设备"报告的角度"对齐到 [雷达系] 的真实方向。
# LakiBeam 出厂 0° 与雷达 x 轴相差 90°；它是设备内部属性，换安装朝向不需要改。
mount:
  axis: z                                   # [雷达系] 绕雷达自身的哪个轴旋转
  angle_deg: 90.0                           # 角度(°)；正负 = 旋转方向（轴名写 '-z' 亦可反向）

# 安装姿态：雷达系 → 世界系 的对应关系
# ⚠️ 约定：键 = [世界系] 的轴，值 = [雷达系] 的轴（可带负号）
#          读作"世界的 x 轴，取自雷达系的哪个轴"
to_world:
  x: -y                                     # 世界 x 轴 = −(雷达 y 轴)   [键=世界系, 值=雷达系]
  y: -z                                     # 世界 y 轴 = −(雷达 z 轴)   → 即"雷达 z 指向世界 −y"
  z: x                                      # 世界 z 轴 = +(雷达 x 轴)   → 雷达 x 需竖直(与转轴平行)

turntable_axis: z                           # [世界系] 拼装时绕哪个轴旋转（= 转盘轴，竖直）

# 标定得到的"安装后微小倾斜"（全 0 = 不修正）
# 合成顺序 Rz(yaw) @ Ry(pitch) @ Rx(roll)；作用在合并链最后一步，已在 [世界系] 下
tilt:
  roll_deg: 0.0                             # [世界系] 绕世界 x 轴
  pitch_deg: 0.0                            # [世界系] 绕世界 y 轴
  yaw_deg: 0.0                              # [世界系] 绕世界 z 轴（= 转轴）

# 雷达自身姿态相对理想安装的偏差（全 0 = 不修正）
# 合成顺序 Rz(yaw) @ Ry(pitch) @ Rx(roll)；作用在合并链第一步，仍在 [雷达系] 下
lidar_tilt:
  roll_deg: 0.0                             # [雷达系] 绕雷达 x 轴
  pitch_deg: 0.0                            # [雷达系] 绕雷达 y 轴
  yaw_deg: 0.0                              # [雷达系] 绕雷达 z 轴

# 偏心：光心（雷达原点）相对转盘旋转轴的位置偏移，单位 米
# 两个分量沿 [雷达系] 的 y / z 轴 —— 代码把它加在"棱镜相位之后、to_world 之前"，
# 且不随相位旋转，所以方向基准就是雷达原始的 y / z 轴。
# 沿转轴（雷达 x / 世界 z）方向的偏移不在此配置内：它只让点云整体上下平移，与偏心无关。
offset:
  y_m: -0.003                               # [雷达系] y 方向，米
  z_m: -0.01                                # [雷达系] z 方向，米
